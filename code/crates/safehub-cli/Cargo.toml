[package]
name = "safehub-cli"
description = "SafeHub CLI — `shub` (gh-like hosting) and `sit` (git-like VCS)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "safehub"
path = "src/bin/safehub.rs"

[[bin]]
name = "shub"
path = "src/bin/shub.rs"

# VCS analogue (git). Encrypted remotes via SafeHub; other verbs → system git.
[[bin]]
name = "sit"
path = "src/bin/sit.rs"

[dependencies]
safehub-browse = { path = "../safehub-browse" }
safehub-api.workspace = true
safehub-client = { workspace = true, features = ["openmls"] }
safehub-crypto = { workspace = true, features = ["openmls"] }
safehub-types.workspace = true
anyhow.workspace = true
clap.workspace = true
hex.workspace = true
rand.workspace = true
serde_json.workspace = true
serde.workspace = true
reqwest.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
